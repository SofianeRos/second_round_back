api_platform:
    title: Second Round API
    version: 1.0.0
    formats:
        jsonld:
            mime_types: ['application/ld+json']
        json:
            mime_types: ['application/json']
    patch_formats:
        json:
            mime_types: ['application/merge-patch+json', 'application/json']
        jsonld:
            mime_types: ['application/merge-patch+json']
    defaults:
        stateless: true
        cache_headers:
            vary: ["Content-Type", "Authorization", "Origin"]
        pagination:
            partial: true
            client_items_per_page: true
    eager_loading:
        max_joins: 3
        force_eager: false
